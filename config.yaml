seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  max_col_missing: 0.20   # drop feature columns missing in more than 20% of all rows (pooled over users)
  max_row_missing: 0.30   # drop rows missing more than 30% of the kept features
  min_label_users: 30     # keep labels that are positive for at least this many users
  pre_drift_frac: 0.60    # first 60% of each user's rows (by time) = pre-drift, rest = post-drift
  calib_hours: 24         # calibration = the full day before the FPR day (sets the alarm thresholds)
  fpr_hours: 24           # FPR = the last full day of pre-drift (only used to measure false alarms)
  min_train_hours: 24     # exclude clients with less training time than this
  min_window_rows: 120    # exclude clients with fewer rows than this in the calibration or FPR day
  clip_z: 5.0             # cap z-scored values at +-clip_z (a few near-constant features reach |z| > 1000)
  paper_train_frac: 0.6   # "paper" split schemes (experiment 1): per-client train/val/test = 60/20/20
  paper_val_frac: 0.2
  paper_split_seed: 0     # fixed random split for "paper_random" (same split in every repetition)

feasibility_users: ["78A91A4E", "86A4F379", "9759096F", "7CE37510", "9DC38D04"]   # UUID prefixes; most post-drift rows

classifier:
  hidden: [64, 64]        # 158 -> 64 -> 64 -> 30 labels
  dropout: 0.2
  lr: 0.001               # Adam
  weight_decay: 0.0
  batch_size: 64
  epochs: 20              # fixed, no early stopping (validation rows are reserved for the detectors)
  threshold: 0.5          # probability above which a label is predicted positive

drift:
  columns_prefixes: ["raw_acc:", "proc_gyro:", "raw_magnet:"]   # all phone motion sensors (83 features)
  magnitudes: [1.0, 2.0, 3.0]   # shift in training standard deviations
  onset_frac: 0.25              # onset at 25% into the post-drift segment
  gradual_width: 120            # rows for the gradual ramp from 0 to m

autoencoder:
  hidden: [64, 32]        # n -> 64 -> 32 -> 64 -> n (proposal Table 5.1)
  lr: 0.001               # Adam
  batch_size: 64
  epochs: 30

alarm:                    # shared by the autoencoder and entropy detectors
  method: std             # std: mean + k*std of calibration scores | quantile: empirical quantile
  k: 3.0
  quantile: 0.99
  confirm: 3              # consecutive rows above threshold before an alarm (c)

fedcond_test:
  queue_size: 20
  alpha: 0.05
  batch_rows: 30          # B new rows per round

detection_race:           # H1 / H2: the drift alarms on every usable user
  kinds: [abrupt, gradual]
  threshold_methods: [std, quantile]   # see alarm: (k, quantile)

federated:                # shared by every federated experiment (src/fedcond.py)
  kind: abrupt            # default drift kind / magnitude for drifted clients (experiments override these)
  magnitude: 2.0
  concurrency: 0.2        # gamma: share of clients training at the same time
  local_epochs: 2
  lambda_base: 0.1        # FedConD's base lambda (tuned on validation: lambda_tuning, 0.1 was best)
  lambda_step: 0.2        # added to the client's lambda each time its trigger fires (paper: 0.1-0.3)
  warmup_rounds: 20       # synchronous FedAvg rounds (lambda = 0) on the rows available at the start
  recenter_window: 1440   # label-free reaction: rows (one day) on each side of the alarm to estimate the shift
  recenter_min_rows: 120  # rows since the alarm needed before the correction is applied

reaction_test:            # oracle trigger with different reactions (drift scheme, scarce labels)
  n_drifted: 5            # ~10% of the 45 usable clients
  seeds: [0, 1, 2]
  kind: abrupt
  magnitude: 2.0
  label_rate: 0.05        # stream rows keeping their labels after the fully labeled training rows
  methods: [none, oracle, oracle_recenter]   # no reaction / FedConD's reaction / re-centering

paper_setup:              # experiment 1 (paper_comparison): close to the FedConD paper's ExtraSensory setup
  schemes: [paper_time, paper_random]   # per-client 60/20/20 split by time or at random (see data:)
  initial_frac: 0.3       # share of each client's training rows available at the start; the rest streams in
  seeds: [0, 1, 2]
  methods: [fedavg, fedprox, fedcond, fedcond_ae]
  fedprox_mu: 0.1         # FedProx's fixed proximal weight (tuned on validation: lambda_tuning, flat in 0.1-4)
  label_rates: [1.0, 0.5, 0.1, 0.05, 0.0]   # experiment 4: share of stream rows that keep their labels
  label_scheme: paper_time                  # experiment 4 runs on the time-ordered split

natural_drift_check:      # is there natural (not injected) drift, and does the autoencoder see it?
  seeds: [0, 1, 2]
  min_day_rows: 60        # a day with fewer rows is skipped
  min_day_labeled: 30     # a day with fewer labeled rows gets no F1 / BCE (its label-free stats are kept)
  min_post_days: 2        # clients with fewer usable post-drift days are skipped

lambda_tuning:            # FedProx mu and FedConD base lambda on the paper_time validation rows (no drift, all labels)
  grid: [0.1, 0.5, 1.0, 2.0, 4.0]
  methods: [fedprox, fedcond]
  seeds: [0, 1, 2]

main_comparison:          # R5 / H3: injected drift + label scarcity, all methods
  n_drifted: 5            # ~10% of the 45 usable clients
  seeds: [0, 1, 2, 3, 4]  # 5 drifted clients per seed -> 25 drifted (client, seed) pairs per cell
  kinds: [abrupt, gradual]
  magnitude: 2.0
  label_rates: [1.0, 0.05, 0.0]
  methods: [fedavg, fedprox, fedcond, fedcond_ae, fedcond_ae_leash, fedcond_ae_recenter, oracle_recenter]
  sensitivity: [fedcond_step01]   # FedConD with lambda_step 0.1 (the paper's smallest), first kind only
