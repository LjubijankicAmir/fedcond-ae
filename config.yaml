seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  max_col_missing: 0.20   # drop feature columns missing in more than 20% of all rows (pooled over users)
  max_row_missing: 0.30   # drop rows missing more than 30% of the kept features
  min_label_users: 30     # keep labels that are positive for at least this many users
  pre_drift_frac: 0.60    # first 60% of each user's rows (by time) = pre-drift, rest = post-drift
  calib_hours: 24         # calibration = the full day before the FPR day (sets the alarm thresholds)
  fpr_hours: 24           # FPR = the last full day of pre-drift (only used to measure false alarms)
  min_train_hours: 24     # exclude clients with less training time than this
  min_window_rows: 120    # exclude clients with fewer rows than this in the calibration or FPR day
  clip_z: 5.0             # cap z-scored values at +-clip_z (a few near-constant features reach |z| > 1000)

feasibility_users: ["78A91A4E", "86A4F379", "9759096F", "7CE37510", "9DC38D04"]   # UUID prefixes; most post-drift rows

classifier:
  hidden: [64, 64]        # 158 -> 64 -> 64 -> 30 labels
  dropout: 0.2
  lr: 0.001               # Adam
  weight_decay: 0.0
  batch_size: 64
  epochs: 20              # fixed, no early stopping (validation rows are reserved for the detectors)
  threshold: 0.5          # probability above which a label is predicted positive

drift:
  columns_prefixes: ["raw_acc:", "proc_gyro:", "raw_magnet:"]   # all phone motion sensors (83 features)
  magnitudes: [1.0, 2.0, 3.0]   # shift in training standard deviations
  onset_frac: 0.25              # onset at 25% into the post-drift segment
  gradual_width: 120            # rows for the gradual ramp from 0 to m

autoencoder:
  hidden: [64, 32]        # n -> 64 -> 32 -> 64 -> n (proposal Table 5.1)
  lr: 0.001               # Adam
  batch_size: 64
  epochs: 30

alarm:                    # shared by the autoencoder and entropy detectors
  method: std             # std: mean + k*std of calibration scores | quantile: empirical quantile
  k: 3.0
  quantile: 0.99
  confirm: 3              # consecutive rows above threshold before an alarm (c)

fedcond_test:
  queue_size: 20
  alpha: 0.05
  batch_rows: 30          # B new rows per round

detection_feasibility:
  kinds: [abrupt, gradual]
  threshold_methods: [std, quantile]   # see alarm: (k, quantile)

federated:
  n_clients: 10           # usable clients with the most post-drift rows
  n_drifted: 2            # drifted clients per seed, drawn at random from the 10
  seeds: [0, 1, 2]
  kind: abrupt
  magnitude: 2.0          # detectable by every detector in step 5
  concurrency: 0.2        # gamma: share of clients training at the same time
  local_epochs: 2
  lambda_base: 0.1        # placeholder, to be tuned
  lambda_step: 0.2        # added to the client's lambda each time its trigger fires
  warmup_rounds: 20       # synchronous FedAvg rounds on the training rows before streaming starts
  triggers: [none, fedcond, autoencoder, oracle]
